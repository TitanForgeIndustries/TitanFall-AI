# Power Management Configuration for Titan Fall AI

# Component power limits (Watts)
power_limits:
  # Core systems
  sensor_fusion: 20.0
  intent_model: 15.0
  torque_controller: 30.0
  energy_manager: 10.0
  fault_detection: 5.0
  thermal_manager: 8.0
  
  # Hardware components
  actuators: 200.0
  sensors: 25.0
  computing: 50.0
  communication: 15.0
  
  # Cooling systems
  fan_system: 20.0
  liquid_cooling: 40.0
  heat_sink: 5.0

# Power modes
power_modes:
  eco_mode:
    multiplier: 0.5
    description: "Energy saving mode with reduced performance"
    
  balanced_mode:
    multiplier: 1.0
    description: "Balanced performance and energy consumption"
    
  performance_mode:
    multiplier: 1.5
    description: "Maximum performance mode"
    
  emergency_mode:
    multiplier: 0.2
    description: "Minimal power usage for emergency situations"

# Battery configuration
battery_config:
  nominal_voltage: 24.0  # V
  capacity: 100.0  # Ah
  max_current: 50.0  # A
  min_voltage: 20.0  # V
  max_voltage: 30.0  # V
  
  # Battery protection
  low_battery_threshold: 20.0  # %
  critical_battery_threshold: 10.0  # %
  charging_current_limit: 25.0  # A
  
  # Battery health monitoring
  health_warning_threshold: 80.0  # %
  health_critical_threshold: 60.0  # %

# Efficiency targets
efficiency_targets:
  sensor_fusion: 0.85
  intent_model: 0.80
  torque_controller: 0.90
  energy_manager: 0.95
  fault_detection: 0.75
  thermal_manager: 0.85
  
  actuators: 0.80
  sensors: 0.90
  computing: 0.85
  communication: 0.88

# Power optimization settings
power_optimization:
  enabled: true
  optimization_rate: 1.0  # Hz
  
  # Dynamic power scaling
  dynamic_scaling_enabled: true
  scaling_factor_min: 0.3
  scaling_factor_max: 1.0
  
  # Component priority (higher number = higher priority)
  component_priority:
    torque_controller: 10
    sensor_fusion: 9
    fault_detection: 8
    energy_manager: 7
    thermal_manager: 6
    intent_model: 5
    actuators: 9
    sensors: 8
    computing: 7
    communication: 6

# Thermal power management
thermal_power_management:
  enabled: true
  
  # Temperature-based power reduction
  temp_power_reduction:
    warning_temp: 60.0  # °C
    critical_temp: 75.0  # °C
    max_temp: 80.0  # °C
    
    # Power reduction factors at different temperatures
    warning_reduction: 0.8
    critical_reduction: 0.5
    max_reduction: 0.2
